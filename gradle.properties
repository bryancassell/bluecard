# Memory for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Build performance: run independent tasks in parallel, reuse task outputs
# (build cache), and skip re-running build configuration when build scripts
# have not changed (configuration cache).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Use AndroidX libraries.
android.useAndroidX=true

# Kotlin code style used by the IDE formatter.
kotlin.code.style=official
