# Version catalog: the single place where library and plugin versions live.
# Reference entries from build scripts as libs.<alias> and libs.plugins.<alias>.

[versions]
# SDK levels, read by every module's build file so they can't drift apart.
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
agp = "9.5.0"
kotlin = "2.4.21"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Compose Multiplatform: the Compose, strings, icons and catalog that common code builds against.
# Its Android artifacts depend on Google's Compose at the version it's built on, so Android gets
# that version or the BOM's, whichever is higher. Raising this can raise Android's Compose.
composeMultiplatform = "1.12.2"
# Compose Multiplatform's Material 3. Its releases after 1.9.0 are alphas, which bring Google's
# Material 3 alphas to Android; 1.9.0's Android artifact is Google's 1.4.0, the BOM's (#345).
# It was built against Compose Multiplatform 1.9.1. On iOS, a symbol it needs that this
# Compose lacks would link silently and throw when used, so #346 links iOS with
# -Xpartial-linkage-loglevel=error, which fails the link instead.
composeMultiplatformMaterial3 = "1.9.0"
# JetBrains' builds of Lifecycle's, Navigation 3's and Navigation Event's Compose libraries, for
# common code. They come out after Google's, so they have versions of their own. On Android,
# they're Google's artifacts, at the versions they're built on, such as Navigation Event 1.1.1
# for 1.1.0, or at Google's entries' versions where those are higher.
lifecycleMultiplatform = "2.11.0"
navigation3 = "1.2.0"
navigation3Multiplatform = "1.2.0"
navigationEventMultiplatform = "1.1.0"
koin = "4.2.2"
# Checks the Koin graph at build time. Each release lists the Kotlin versions it was
# verified on; on another, it builds with a warning naming them.
koinPlugin = "1.2.1"
# KSP versions are no longer tied to Kotlin versions (since KSP 2.3.0).
ksp = "2.3.12"
kotlinxCoroutines = "1.11.0"
room3 = "3.0.3"
# The SQLite that Room's driver bundles; the androidx.sqlite that Room 3.0.3 depends on.
sqlite = "2.7.1"
kotlinxSerialization = "1.12.0"
kotlinxDatetime = "0.8.0"
datastore = "1.3.0"
coreSplashscreen = "1.2.0"
# Decimal numbers that common code can use; its BigDecimal is java.math's on Android.
bignum = "1.0.5"
# Files and streams that common code can use (ARCHITECTURE.md, Storage errors).
okio = "3.18.2"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
robolectric = "4.17"
# Accessibility checks in Compose UI tests; see ARCHITECTURE.md (Compose UI and screenshot tests).
accessibilityTestFramework = "4.1.1"
# Screenshot tests under Robolectric; see ARCHITECTURE.md (Compose UI and screenshot tests).
roborazzi = "1.77.0"
# Debug builds only; see ARCHITECTURE.md (Debug builds). 3.0 is still in alpha.
leakcanary = "2.14"
spotless = "8.10.4"
# ktlint is run by Spotless; this pins the ktlint engine version.
ktlint = "1.8.0"
# Coverage engine used by both AGP (test data) and Gradle (verification).
jacoco = "0.8.15"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-testing = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-testing", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
androidx-room3-testing = { group = "androidx.room3", name = "room3-testing", version.ref = "room3" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-sqlite-bundled-jvm = { group = "androidx.sqlite", name = "sqlite-bundled-jvm", version.ref = "sqlite" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
bignum = { group = "io.github.artificialpb", name = "bignum", version.ref = "bignum" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
# @InjectedParam and @Qualifier, which the compiler plugin reads.
koin-annotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# The Compose BOM pins compatible versions of every Google Compose library, so the
# androidx.compose entries below it deliberately have no version.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Compose Multiplatform's libraries, which common code uses.
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMultiplatformMaterial3" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleMultiplatform" }
jetbrains-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleMultiplatform" }
jetbrains-lifecycle-viewmodel-navigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleMultiplatform" }
jetbrains-navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3Multiplatform" }
jetbrains-navigationevent-compose = { group = "org.jetbrains.androidx.navigationevent", name = "navigationevent-compose", version.ref = "navigationEventMultiplatform" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
accessibility-test-framework = { group = "com.google.android.apps.common.testing.accessibility.framework", name = "accessibility-test-framework", version.ref = "accessibilityTestFramework" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room3" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinPlugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
