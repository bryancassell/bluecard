# TRIAL for #14, removed before the PR: compares ways to run instrumented tests in CI.
name: Emulator trial

on:
  push:
    branches: [issue-14-ci-emulator-job]

permissions:
  contents: read

jobs:
  action:
    name: Action ${{ matrix.api }} ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '36'
            target: aosp_atd
          - api: '37.0'
            target: google_apis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-boot-timeout: 1200
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: action-${{ matrix.api }}-${{ matrix.target }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  gmd:
    name: GMD ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [api36Atd, api37Google]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Instrumented tests
        run: >-
          ./gradlew ${{ matrix.device }}DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gmd-${{ matrix.device }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
