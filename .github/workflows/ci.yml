# Runs the same commands we use locally on every pull request and on main.
# Pushes to main also write the Gradle cache that pull request runs read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run still in progress for
# the older commit, since only the latest result matters. head_ref is only set
# for pull requests; every other run (pushes to main) gets its own group from
# run_id, so it is never cancelled and every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same major version as Android Studio's bundled JDK, used for local builds.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches Gradle state. "basic" is the
      # open-source (MIT) cache provider.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Compile, unit tests, coverage, test rules, lint and formatting.
      - run: ./gradlew build

      # On failure, keep the HTML reports (lint, tests), raw test results and
      # failed screenshot tests' images so they can be downloaded from the run's
      # summary page.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # Emulator jobs on GitHub's runners sometimes hang instead of failing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reads Build's Gradle cache but never writes it. Both jobs ask for the same
      # cache key and only the first save wins, so this job, which finishes first
      # and downloads less, would otherwise replace Build's cache on main.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # Lets the emulator use hardware virtualization; without it, it's too slow to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Restores the emulator, the system image, the managed AVD with its boot
      # snapshot, and the adb key the snapshot trusts. Gradle then skips the
      # downloads and the cold boot that makes the snapshot. AGP never updates
      # an installed emulator or image, so they stay at the cached versions:
      # change the version at the end of the key to get newer ones, and change
      # the key whenever the device in app/build.gradle.kts changes.
      - uses: actions/cache/restore@v6
        id: managed-device-cache
        with: &managed-device-cache
          key: managed-device-pixel6Api37-google_apis_ps16k-x86_64-v1
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-37.0/google_apis_ps16k/x86_64
            ~/.android/avd/gradle-managed
            ~/.android/adbkey*

      # TEMPORARY: sizes of the cached paths and the cost of looking up versions.
      - name: Measure cache contents
        run: |
          du -sh /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images/android-37.0/google_apis_ps16k/x86_64 ~/.android/avd/gradle-managed ~/.android/adbkey* || true
          find ~/.android/avd/gradle-managed -size +20M -exec ls -lsh {} \; || true
          time (tar -cf - -C ~/.android/avd gradle-managed | zstd -T0 --long=30 | wc -c) || true
          time (/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -E '^ *(emulator|system-images;android-37.0;google_apis_ps16k;x86_64) ') || true
          cat /usr/local/lib/android/sdk/emulator/source.properties || true
          grep -h -i 'revision\|Pkg.Revision' /usr/local/lib/android/sdk/system-images/android-37.0/google_apis_ps16k/x86_64/source.properties || true

      # Gradle builds the app and test APKs and, on a cache miss, downloads the
      # emulator and system image and boots the emulator once to save a snapshot.
      # Then it starts the emulator from the snapshot, runs app/src/androidTest
      # and shuts it down. The runner has no GPU, so the emulator draws in software.
      - run: >-
          ./gradlew pixel6Api37DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Only pushes to main save the cache, as with the Gradle cache. Pull requests
      # read main's entry instead of each saving a copy, which would push the
      # Gradle caches out of the repository's 10 GB. Saved only after the tests
      # pass.
      # TEMPORARY: this branch saves too, to measure a cache hit before merging.
      - uses: actions/cache/save@v6
        if: >-
          (github.ref == 'refs/heads/main' || github.head_ref == 'feature/5-cache-emulator')
          && steps.managed-device-cache.outputs.cache-hit != 'true'
        with: *managed-device-cache

      # Also after a timeout, which cancels the job instead of failing it.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
