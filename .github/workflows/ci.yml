# Runs the same commands we use locally on every pull request and on main.
# Pushes to main also write the Gradle cache that pull request runs read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run still in progress for
# the older commit, since only the latest result matters. head_ref is only set
# for pull requests; every other run (pushes to main) gets its own group from
# run_id, so it is never cancelled and every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same major version as Android Studio's bundled JDK, used for local builds.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches Gradle state. "basic" is the
      # open-source (MIT) cache provider.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Compile, unit tests, coverage, test rules, lint and formatting. It compiles
      # the iOS code too, which holds common code to common APIs, but linking and
      # running its tests need a Mac, so the iOS job does those.
      - run: ./gradlew build

      # Room's plugin rewrites shared/schemas from the compiled entities, before
      # MigrationTest reads them. A change there means an entity or Room's
      # identity hash changed without a new database version, so installed
      # apps' databases wouldn't open.
      - name: Check that the build left shared/schemas unchanged
        run: |
          git status --porcelain -- shared/schemas
          test -z "$(git status --porcelain -- shared/schemas)"

      # On failure, keep the HTML reports (lint, tests), raw test results and
      # failed screenshot tests' images so they can be downloaded from the run's
      # summary page.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
            shared/build/outputs/roborazzi/

  ios:
    name: iOS
    runs-on: macos-26
    # About twice its first run's 13 minutes, with no caches, so a hung simulator
    # or xcodebuild fails the check rather than keeping it pending for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Named rather than the image's default, which GitHub moves to each new
      # Xcode, so a change of Xcode comes in a pull request. 26.6 is the newest
      # on the image; Xcode 27 is only on a preview image (docs/toolchain.md).
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Its cache key names the runner's OS, so this job's cache is its own and
      # doesn't replace Build's.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The tests in shared/src/commonTest and shared/src/iosTest, on a simulator
      # that Gradle starts without booting it.
      - run: ./gradlew :shared:iosSimulatorArm64Test

      # Its first build phase runs Gradle to link the Shared framework, then Xcode
      # compiles the Swift code against it and links the app. Debug, for the
      # simulator, which the tests' binary is too; iPhone and Release builds come
      # with TestFlight (#356). arm64, since the image also lists each simulator
      # under Rosetta.
      - name: Build the iOS app
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -destination 'platform=iOS Simulator,arch=arm64,name=iPhone 17,OS=latest'
          -derivedDataPath iosApp/build build

      # Also after a timeout, which cancels the job instead of failing it.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests/iosSimulatorArm64Test/
            shared/build/test-results/iosSimulatorArm64Test/

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # Emulator jobs on GitHub's runners sometimes hang instead of failing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reads Build's Gradle cache but never writes it. Both jobs ask for the same
      # cache key and only the first save wins, so this job, which finishes first
      # and downloads less, would otherwise replace Build's cache on main.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # Lets the emulator use hardware virtualization; without it, it's too slow to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Gradle builds the app and test APKs and downloads the system image, then
      # starts the managed emulator, runs app/src/androidTest and shuts it down.
      # The runner has no GPU, so the emulator draws in software.
      - run: >-
          ./gradlew pixel6Api37DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      # Also after a timeout, which cancels the job instead of failing it.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
