# Runs the same commands we use locally on every pull request and on main.
# Pushes to main also write the Gradle cache that pull request runs read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run still in progress for
# the older commit, since only the latest result matters. Runs on main are never
# cancelled, so every commit on main gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same major version as Android Studio's bundled JDK, used for local builds.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches Gradle state. "basic" is the
      # open-source (MIT) cache provider.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Compile, unit tests, coverage, test rules, lint and formatting.
      - run: ./gradlew build

      # On failure, keep the HTML reports (lint, tests) and raw test results so
      # they can be downloaded from the run's summary page.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
