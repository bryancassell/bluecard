# Runs the same commands we use locally on every pull request and on main.
# Pushes to main also write the Gradle cache that pull request runs read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same major version as Android Studio's bundled JDK, used for local builds.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches Gradle state. "basic" is the
      # open-source (MIT) cache provider.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Compile, unit tests, coverage minimums, test rules, lint and formatting.
      - run: ./gradlew build

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Hardware acceleration for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # Quoted: unquoted YAML turns 37.0 into 37, which has no SDK package.
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedAndroidTest
