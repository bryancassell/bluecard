# Runs the same commands we use locally on every pull request and on main.
# Pushes to main also write the Gradle cache that pull request runs read.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run still in progress for
# the older commit, since only the latest result matters. head_ref is only set
# for pull requests; every other run (pushes to main) gets its own group from
# run_id, so it is never cancelled and every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same major version as Android Studio's bundled JDK, used for local builds.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Validates the Gradle wrapper and caches Gradle state. "basic" is the
      # open-source (MIT) cache provider.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Compile, unit tests, coverage, test rules, lint and formatting.
      - run: ./gradlew build

      # On failure, keep the HTML reports (lint, tests), raw test results and
      # failed screenshot tests' images so they can be downloaded from the run's
      # summary page.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/

  instrumented-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # Emulator jobs on GitHub's runners sometimes hang instead of failing.
    timeout-minutes: 30
    # TEMPORARY: three copies without an emulator cache and three that cache only
    # the managed AVD and its snapshot, to compare them on the same commit.
    strategy:
      fail-fast: false
      matrix:
        cache: [none, avd]
        copy: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Reads Build's Gradle cache but never writes it. Both jobs ask for the same
      # cache key and only the first save wins, so this job, which finishes first
      # and downloads less, would otherwise replace Build's cache on main.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      # Lets the emulator use hardware virtualization; without it, it's too slow to boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # TEMPORARY (experiment): restores the newest saved AVD and snapshot. Its
      # key names the emulator and image versions it was made with.
      - uses: actions/cache/restore@v6
        if: matrix.cache == 'avd'
        id: avd-cache
        with:
          key: managed-device-avd-pixel6Api37
          restore-keys: managed-device-avd-pixel6Api37-
          path: |
            ~/.android/avd/gradle-managed
            ~/.android/adbkey*

      # TEMPORARY: the host CPU, which a snapshot may depend on.
      - run: grep -m1 'model name' /proc/cpuinfo

      # Gradle builds the app and test APKs and, on a cache miss, downloads the
      # emulator and system image and boots the emulator once to save a snapshot.
      # Then it starts the emulator from the snapshot, runs app/src/androidTest
      # and shuts it down. The runner has no GPU, so the emulator draws in software.
      # TEMPORARY: --info shows why AGP did or didn't reuse the snapshot.
      - run: |
          set -o pipefail
          ./gradlew pixel6Api37DebugAndroidTest --info \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            2>&1 | tee gradle-info.log | grep -E --line-buffered '^> Task |BUILD |FAIL'
      - if: always()
        run: grep -E 'loadable|Loadable|snapshot|Snapshot|AVD creation' gradle-info.log | grep -v 'ClasspathEntrySnapshot|classpath snapshot' | cut -c1-300 | head -100

      # TEMPORARY (experiment): saves the AVD under the versions Gradle installed,
      # when they differ from the restored entry's.
      - id: avd-key
        if: matrix.cache == 'avd'
        run: |
          sdk=/usr/local/lib/android/sdk
          emulator=$(sed -n 's/^Pkg.Revision=//p' $sdk/emulator/source.properties)
          image=$(sed -n 's/^Pkg.Revision=//p' $sdk/system-images/android-37.0/google_apis_ps16k/x86_64/source.properties)
          echo "key=managed-device-avd-pixel6Api37-emulator-$emulator-image-$image" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        if: >-
          matrix.cache == 'avd'
          && steps.avd-cache.outputs.cache-matched-key != steps.avd-key.outputs.key
        with:
          key: ${{ steps.avd-key.outputs.key }}
          path: |
            ~/.android/avd/gradle-managed
            ~/.android/adbkey*

      # Also after a timeout, which cancels the job instead of failing it.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
