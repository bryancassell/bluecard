# Dependabot opens pull requests to update dependencies once a week.
# Minor and patch updates arrive together in one pull request per ecosystem;
# each major update gets its own pull request, since it may need code changes.
version: 2
updates:
  # Version catalog (gradle/libs.versions.toml) and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Why AndroidX skips the 3-day wait: "Continuous integration" in
    # docs/toolchain.md. Remove this block when #154 is done. default-days must
    # stay: a cooldown block without it turns the wait off for everything.
    cooldown:
      default-days: 3
      exclude: ["androidx.*"]
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
