# Dependabot opens pull requests to update dependencies once a week.
# Minor and patch updates arrive together in one pull request per ecosystem;
# each major update gets its own pull request, since it may need code changes.
version: 2
updates:
  # Version catalog (gradle/libs.versions.toml) and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Dependabot waits 3 days after a release by default and skips versions it
    # can't date. Google Maven only dates an artifact's newest version, so when
    # that is a pre-release, every stable AndroidX release would be skipped.
    # Libraries from other Google Maven groups would need adding here too.
    # Remove this when #154 is done.
    cooldown:
      exclude: ["androidx.*"]
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
